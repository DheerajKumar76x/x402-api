name: Auto Submit to Registries & Awesome Lists

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Execute Discovery & Submission Engine
        env:
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          MAX_PR_PER_RUN: "3"
        run: node scripts/auto-submit-registries.js

      - name: Save submission tracking
        run: |
          if git diff --quiet -- .github/submitted-registries.json; then
            echo "No new submissions to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/submitted-registries.json
          git commit -m "chore: track registry submissions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
