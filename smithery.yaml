startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - AGENT_WALLET_PRIVATE_KEY
    properties:
      AGENT_WALLET_PRIVATE_KEY:
        type: string
        description: EVM private key (0x...) used to sign and pay for x402 API requests
  command: node
  args:
    - dist/mcp-server.js